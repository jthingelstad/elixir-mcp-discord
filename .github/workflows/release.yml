name: release

# A tag is a release: `git tag v0.3.0 && git push --tags` publishes the
# notes from the commits since the previous tag and, since v0.4.0, the
# container image (the `image` job below). The release is the changelog and
# the pin: `git checkout v0.3.0`, or the image tagged 0.3.0, is a known
# build, and the boot hello names it (build=<version>+<sha> from a checkout,
# <version> from an image).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Check the tag matches package.json
        run: |
          v="v$(node -p "require('./package.json').version")"
          test "$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but package.json says $v"; exit 1; }
      - name: Release notes from the commits since the previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}${GITHUB_REF_NAME}
          { echo "## ${GITHUB_REF_NAME}"; echo; git log --format='- %s' "$range" | grep -v '^- Format the tree'; } > notes.md
          cat notes.md
      - run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # The same tag as a container image, for operators who run it with Docker
  # (docs/DOCKER.md): ghcr.io/<owner>/elixir-mcp-discord:<version> and
  # :latest, for linux/amd64 and linux/arm64 (a Raspberry Pi, an Apple
  # Silicon Mac). After the first one, check the package is public under
  # the repository's Packages.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Version without the v
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
