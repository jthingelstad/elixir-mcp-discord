name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and a current release.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # No secrets, no network: test/setup.js supplies dummy config so the
      # suite runs on a bare clone. Anything needing a real credential would be
      # an integration test, which this deliberately is not.
      - run: npm test
