the turnId and request id. Use the generated schedule and completion receipt for the Sunday synthesis in `AGENT-TEAM/summaries/<year>-W<week>.md`; catch up a missed one at the next eligible invocation without repeating a completed summary. Acquire the `judge` checkout lease only immediately before mutation, check it before the first edit and before push, never clear or break another holder's lease, never publish pre-existing work, release only from a clean checkout, and preserve the rules in AGENTS.md, the human boundary in WORKFLOW.md, and the rule that grading uses the ledger only: never ask the bot a question, never post, never react, never run a routine, and never add any code path that reads the ledger back into the bot. Keep automation memory to Current state, Active watches, one replace-in-place Latest run, and the last graded `at` per instance. Do not claim shipped behavior from source publication alone."

