version = 2
repo = "."
timezone = "America/Chicago"

# Drafted September 14, 2026 for Jamie's approval. Calendar starts use local
# Chicago time. Interval activities use an initial prompt date check because
# the installed app miscalculates interval timezones; preserve that check
# when reinstalling. launch_cwd records the app launch directory relative to
# this checkout — the CHECKOUT, not an instance: the objectives read the
# three instances under ~/.elixir-mcp-discord/ by path and never run the
# bot from here. Event-driven follow-ups remain explicit starts.

[[automation]]
id = "run-the-preview"
name = "Run the Preview"
objective = "run"
objective_file = "AGENT-TEAM/run-the-preview.md"
status = "ACTIVE"
rrule = "RRULE:FREQ=DAILY;BYHOUR=6;BYMINUTE=50"
model = "gpt-5.6-terra"
reasoning_effort = "high"
execution_environment = "local"
launch_cwd = "."
prompt = "Follow the project instructions already loaded by Codex. Read `/Users/otto/Projects/clash-royale/elixir-mcp-discord/AGENTS.md`, `/Users/otto/Projects/clash-royale/elixir-mcp-discord/AGENT-TEAM/WORKFLOW.md`, `/Users/otto/Projects/clash-royale/elixir-mcp-discord/AGENT-TEAM/READING.md`, `/Users/otto/Projects/clash-royale/elixir-mcp-discord/AGENT-TEAM/README.md`, and `/Users/otto/Projects/clash-royale/elixir-mcp-discord/AGENT-TEAM/run-the-preview.md` completely; use the reading map to review what changed in `AGENTS.md` and `git log` since the previous successful run, then pursue the `run` objective exactly as written. Run preflight first and measure current live evidence before changing anything; a healthy no-op is success. For each of the three instances under `~/.elixir-mcp-discord/` read its launchd state, its log's boot lines and errors since the previous run, its state file read-only, and whether the day's turns in the log are in its ledger; compare each running build's sha with `origin/main`. Own a clear operational gap (an instance down or on old code, a boot error, a stuck cursor, a missing ledger day, an Elixir contract this bot no longer matches, a boundary drift) through source fix, regression coverage, `npm test`, push, a restart of each instance one at a time reading each boot, and read-only acceptance from the next natural turn. Acquire the `run` checkout lease only immediately before mutation, check it before the first edit and before push, never clear or break another holder's lease, never publish pre-existing work, release only from a clean checkout, and preserve the rules in AGENTS.md (no clan in the repo, no local data, no fallback, no tool list, public repo with no secrets), the human boundary in WORKFLOW.md (instance `agent/` and `.env` are Jamie's), and the rule that acceptance uses natural evidence only: never run a routine early, never ask the bot a question, never post, never replay a backlog, never set `mark_seen`. Preflight separates observation from checkout mutation eligibility: continue safe read-only review during contention with trusted tooling; a blocked checkout forbids mutations, including restarts for a code change not yet on `main`. Keep automation memory to Current state, Active watches, and one replace-in-place Latest run. Do not claim shipped behavior from source publication alone — a `src/` change is live only after each instance's boot line names its sha."

